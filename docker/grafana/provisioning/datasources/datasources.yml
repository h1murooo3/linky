apiVersion: 1
datasources:
  # Не ставить isDefault: true — в Grafana 11+ уже может быть дефолтный DS,
  # тогда provisioning падает: "Only one datasource ... can be marked as default".
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
